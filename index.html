<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh sách nhạc nổi tiếng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>🎵 Danh sách các bài nhạc nổi tiếng 🎵</h1>

  <div class="gallery">
    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/en/4/45/Divide_cover.png" alt="Shape of You">
      <div class="info">
        <h3>Shape of You</h3>
        <p>Ed Sheeran</p>
      </div>
    </div>
    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/en/0/09/The_Weeknd_-_Blinding_Lights.png" alt="Blinding Lights">
      <div class="info">
        <h3>Blinding Lights</h3>
        <p>The Weeknd</p>
      </div>
    </div>
    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/en/f/f1/Luis_Fonsi_-_Despacito_ft._Daddy_Yankee.jpg" alt="Despacito">
      <div class="info">
        <h3>Despacito</h3>
        <p>Luis Fonsi ft. Daddy Yankee</p>
      </div>
    </div>
    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/en/3/3e/Adele_-_Hello_%28single%29.png" alt="Hello">
      <div class="info">
        <h3>Hello</h3>
        <p>Adele</p>
      </div>
    </div>
    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/en/0/0b/Mark_Ronson_-_Uptown_Funk_%28feat._Bruno_Mars%29.png" alt="Uptown Funk">
      <div class="info">
        <h3>Uptown Funk</h3>
        <p>Mark Ronson ft. Bruno Mars</p>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
